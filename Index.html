<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="toggle-btn">🌙 Dark Mode</button>

        <!-- Profile Header -->
        <header class="profile">
            <div class="avatar">🚀</div>
            <h1>Your Name</h1>
            <p class="bio">Web Developer & Creator. Welcome to my space on the web!</p>
        </header>

        <!-- Links Section -->
        <main class="links">
            <a href="https://github.com" target="_blank" class="link-card">
                <span>💻</span> GitHub Profile
            </a>
            <a href="https://linkedin.com" target="_blank" class="link-card">
                <span>💼</span> LinkedIn Connect
            </a>
            <a href="https://twitter.com" target="_blank" class="link-card">
                <span>🐦</span> X / Twitter
            </a>
            <a href="mailto:youremail@example.com" class="link-card">
                <span>✉️</span> Contact Me
            </a>
        </main>

        <!-- Footer -->
        <footer>
            <p>© <span id="year"></span> Your Name. Built with HTML, CSS & JS.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
